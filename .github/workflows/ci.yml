name: ci
on:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download \
            --repo ${{ github.repository }} \
            --tag v1.0.0 \
            --pattern 'xc8-v3.00-full-install-linux-x64-installer.run' \
            --output xc8-installer.run
          sudo ./xc8-installer.run --mode unattended --netservername aidan.gannon --"Add to PATH" 1
          make